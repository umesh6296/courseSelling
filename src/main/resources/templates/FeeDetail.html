<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fee Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        h1 {
            color: #343a40;
            text-align: center;
            margin-bottom: 20px;
        }
        table {
            background-color: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        th {
            background-color: #4CAF50; /* Green header */
            color: white;
            text-align: center;
        }
        td {
            text-align: center;
        }
        .table-hover tbody tr:hover {
            background-color: #ffeb3b; /* Yellow highlight on hover */
        }
        .table-striped tbody tr:nth-of-type(odd) {
            background-color: #e0f7fa; /* Light blue for odd rows */
        }
        .table-striped tbody tr:nth-of-type(even) {
            background-color: #f1f8e9; /* Light green for even rows */
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="mt-4">Fee Details</h1>
    <table class="table table-bordered table-striped table-hover mt-4">
        <thead>
        <tr>
            <th>Course Name</th>
            <th>Fee Amount</th>
            <th>Date of Fee</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="fee : ${feeList}">
            <td th:text="${fee.courseName}"></td>
            <td th:text="${fee.feeAmount}"></td>
            <td th:text="${fee.date}"></td>
        </tr>
        </tbody>
    </table>
    <div class="text-center mt-4">
        <a href="/thanks" class="btn btn-primary btn-lg">Finish</a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
