<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom styles -->
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            max-width: 500px;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            animation: fadeInAnimation 0.5s ease-out forwards; /* Fade in animation */
        }
        .card-header {
            background-color: #007bff;
            color: #fff;
            text-align: center;
            font-size: 1.5rem;
            padding: 10px;
            margin-bottom: 20px;
        }
        .form-group {
            transition: all 0.3s ease; /* Smooth transition for form elements */
        }
        /* Custom keyframes for fade-in animation */
        @keyframes fadeInAnimation {
            from {
                opacity: 0;
                transform: translateY(-20px); /* Slide up from top */
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="card-header">
        Student Registration
    </div>
    <div class="card-body">
        <form id="registrationForm" th:action="@{/save}" method="post" class="needs-validation" novalidate>
            <!-- Name -->
            <div class="mb-3">
                <label for="studentName" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="studentName" name="studentName" placeholder="Enter your full name" maxlength="200" required="required">
                <div class="invalid-feedback">
                    Please enter your full name.
                </div>
            </div>

            <!-- Phone Number -->
            <div class="mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="phone" class="form-control" id="phone" name="phone" placeholder="Enter your phone number" min="0" max="9999999999" required="required">
                <div class="invalid-feedback">
                    Please enter a valid phone number.
                </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" maxlength="200" required="required">
                <div class="invalid-feedback">
                    Please enter a valid email address.
                </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Password" maxlength="200" required="required">
                <div class="invalid-feedback">
                    Please enter a password.
                </div>
            </div>

            <!-- Address -->
            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <textarea class="form-control" id="address" name="address" placeholder="Enter your address" rows="3" maxlength="200" required="required"></textarea>
                <div class="invalid-feedback">
                    Please enter your address.
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Register</button>
        </form>
    </div>
</div>

<!-- Bootstrap JS and dependencies -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- jQuery (necessary for Bootstrap's JavaScript plugins) -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    // JavaScript to enable client-side validation and custom error messages
    (function() {
        'use strict';
        var forms = document.querySelectorAll('.needs-validation');

        Array.prototype.slice.call(forms)
            .forEach(function(form) {
                form.addEventListener('submit', function(event) {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }

                    form.classList.add('was-validated');
                }, false);
            });
    })();
</script>
</body>
</html>
