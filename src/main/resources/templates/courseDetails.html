<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Course Details</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="container mt-4">
  <div class="row">
    <div class="col">
      <div class="card mb-4">
        <div class="card-header text-center">
          <h2 th:text="${course.courseName}">Course Name</h2>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-4">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Description</h5>
              <p class="card-text" th:text="${course.description}">Course Description</p>
            </div>
          </div>
        </div>

        <div class="col-md-6 mb-4">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Fee Amount</h5>
              <p class="card-text" th:text=" ${course.feeAmount}">Course Fee Amount</p>
            </div>
          </div>
        </div>
      </div>

      <div class="text-center">
        <a th:href="@{/enroll/{courseId}(courseId=${course.courseId})}" class="btn btn-success">Enroll</a>
        <a th:href="@{/schedule/{courseId}(courseId=${course.courseId})}" class="btn btn-info">Schedule</a>

      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS and dependencies -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kQtW33rZJAHjgefvhyyzcGFffDzKAH4Xr9isBlKt/5S5TFLBQyx8pLEI8q5gWOm7" crossorigin="anonymous"></script>
</body>
</html>
