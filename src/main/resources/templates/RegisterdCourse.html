<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registered Courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container {
            margin-top: 50px;
        }
        .table {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .table th, .table td {
            vertical-align: middle;
        }
        .thead-light th {
            background-color: #f8f9fa;
        }
        .header-title {
            color: #007bff;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .table-hover tbody tr:hover {
            background-color: #f1f1f1;
        }
        .btn-custom {
            background-color: #007bff;
            color: white;
            border-radius: 20px;
            padding: 5px 10px;
            font-size: 0.9rem;
        }
        .btn-custom:hover {
            background-color: #0056b3;
            color: white;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="header-title">Registered Courses</h1>
    <div class="table-responsive">
        <table class="table table-hover">
            <thead class="thead-light">
            <tr>
                <th scope="col">Course Name</th>
                <th scope="col">Email</th>
                <th scope="col">Schedule Id</th>

            </tr>
            </thead>
            <tbody>
            <tr th:each="course : ${registeredCourses}">
                <td th:text="${course.courseName}"></td>
                <td th:text="${course.email}"></td>
                <td th:text="${course.scheduleId}"></td>
                <td>
                    <a th:href="@{/fees/{email}/{courseName}(email=${course.email},courseName=${course.courseName})}" class="btn btn-custom">Fee Details</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
