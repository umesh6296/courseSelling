<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Course List</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
        .custom-header {
            background-color: #f8f9fa;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #e9ecef;
        }
        .custom-header h1 {
            font-family: 'Arial', sans-serif;
            font-weight: bold;
            color: #007bff;
        }
        .custom-header p {
            font-size: 1.2rem;
            color: #6c757d;
        }
        .header-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }
        .btn-custom {
            background-color: #007bff;
            color: white;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 1rem;
            text-decoration: none;
        }
        .btn-custom:hover {
            background-color: #0056b3;
            color: white;
        }
    </style>
</head>
<body>
<div class="custom-header">
  <h1>Course List</h1>
  <img src="https://wallpaperaccess.com/full/1772233.jpg" alt="study" class="header-img">
</div>

<div class="container mt-4">
  <div class="row">
    <div class="col">
      <h2>Courses Available:</h2>
      <table class="table table-hover">
        <thead class="thead-light">
        <tr>
          <th scope="col">Course Name</th>
          <th scope="col">Description</th>
          <th scope="col">Fee Amount</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="course : ${list}">
          <td>
            <a th:href="@{/courses/{courseId}(courseId=${course.courseId})}" class="btn btn-custom" th:text="${course.courseName}"></a>
          </td>
          <td th:text="${course.description}"></td>
          <td th:text="${course.feeAmount}"></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Bootstrap JS and dependencies -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
