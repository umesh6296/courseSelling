<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Course Schedule</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .enroll-button {
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <div class="row">
        <div class="col">
            <h2>Course Schedule</h2>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Schedule Id</th>
                    <th>Course Name</th>
                    <th>Start Date</th>
                    <th>End Date</th>
                    <th>Time</th>
                    <th>Duration</th>
                    <th>Class Type</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="schedule : ${schedules}">
                    <td th:text="${schedule.scheduleId}"></td>
                    <td th:text="${session.courseName}"></td>
                    <td th:text="${schedule.startDate}"></td>
                    <td th:text="${schedule.endDate}"></td>
                    <td th:text="${schedule.time}"></td>
                    <td th:text="${schedule.duration}"></td>
                    <td th:text="${schedule.classType}"></td>
                    <td class="enroll-button">
                        <a th:href="@{/login}" class="btn btn-success">Enroll</a>
                    </td>

                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kQtW33rZJAHjgefvhyyzcGFffDzKAH4Xr9isBlKt/5S5TFLBQyx8pLEI8q5gWOm7" crossorigin="anonymous"></script>
</body>
</html>
